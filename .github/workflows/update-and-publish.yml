name: Update from upstream and Publish Firefox Extension

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git remote add upstream https://github.com/siyuan-note/siyuan-chrome.git || true
          git fetch upstream --tags
          git fetch origin --tags

      - name: Save current version
        id: current_version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' manifest.json | cut -d '"' -f 4)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "当前版本: $VERSION"

      - name: Pull and merge from upstream
        run: |
          git checkout main
          git config pull.rebase false
          git pull upstream main -X theirs --no-edit

      - name: Convert Chrome API to Firefox API
        run: |
          find . -type f -name "*.js" -not -path "*/node_modules/*" -not -path "*/\.*" | while read file; do
            echo "处理文件: $file"
            sed -i 's/chrome\./browser\./g' "$file"
          done

      - name: Check for version change
        id: version_check
        run: |
          NEW_VERSION=$(grep -o '"version": "[^"]*"' manifest.json | cut -d '"' -f 4)
          echo "新的版本: $NEW_VERSION"
          if [ "${{ steps.current_version.outputs.current_version }}" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "auto: sync upstream & convert chrome api to browser api"
            git push origin main
          else
            echo "无变更，跳过提交推送"
          fi

      # 判断对应v* tag是否已经存在
      - name: Check whether tag exists
        id: tag_check
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          TAG_NAME="v${{ steps.version_check.outputs.new_version }}"
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME 已存在，将跳过Release创建"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME 不存在，可以创建Release"
          fi

      - name: Install web-ext
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          npm install --global web-ext

      - name: Build Firefox extension XPI
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          web-ext build --no-input
          ls -la web-ext-artifacts/

      # 清理旧Release + 删除对应远程git tag，仅保留最新5个正式Release
      - name: Retain only latest 5 releases & delete git tags
        if: steps.version_check.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/github-script@v7
        with:
          github_token: ${{ secrets.ACTIONS_PAT }}
          script: |
            const repo = context.repo;
            const maxKeep = 5;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: repo.owner,
              repo: repo.repo,
              per_page: 100
            });
            const validReleases = releases
              .filter(r => !r.draft)
              .sort((a,b) => new Date(b.published_at) - new Date(a.published_at));

            console.log(`一共找到 ${validReleases.length} 个正式Release，最多保留${maxKeep}个`);
            const toDelete = validReleases.slice(maxKeep);

            for(const rel of toDelete){
              const tag = rel.tag_name;
              console.log(`准备删除Release: ${tag}, release_id:${rel.id}`);
              await github.rest.repos.deleteRelease({
                owner: repo.owner,
                repo: repo.repo,
                release_id: rel.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: repo.owner,
                  repo: repo.repo,
                  ref: `tags/${tag}`
                });
                console.log(`已删除远程git tag: ${tag}`);
              } catch(e){
                console.warn(`删除tag ${tag}失败:`, e.message);
              }
            }
            if(toDelete.length ===0){
              console.log("没有需要删除的旧Release与tag");
            }

      - name: Create GitHub Release & upload XPI
        if: steps.version_check.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          name: Release v${{ steps.version_check.outputs.new_version }}
          body: |
            自动同步上游 siyuan‑note/siyuan‑chrome 构建 Firefox 扩展
            - 上游版本：${{ steps.version_check.outputs.new_version }}
            - 自动转换 chrome.* → browser.* API
          files: |
            web-ext-artifacts/*.xpi
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT }}
